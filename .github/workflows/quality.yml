name: Calidad de software

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, pruebas, cobertura y SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cachear dependencias de Gradle y SonarCloud
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.sonar/cache
          key: ${{ runner.os }}-gradle-sonar-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-sonar-

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y ejecutar pruebas (JUnit 5 + Karate) con cobertura JaCoCo
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Analizar con SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar --no-daemon

      - name: Aviso cuando SonarCloud no esta configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::No se encontro el secreto SONAR_TOKEN, se omitio el analisis de SonarCloud. Ver docs/taller-analisis-estatico para configurarlo."

      - name: Publicar reporte de pruebas JUnit y Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: build/reports/tests/test

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: build/reports/jacoco/test

      - name: Publicar el JAR generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: procesador-notas-ponderadas-jar
          path: build/libs/*.jar
